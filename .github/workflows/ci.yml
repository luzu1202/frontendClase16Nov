name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked development tools
        run: npm ci

      - name: Check syntax, framework/library versions, HTML, CSS, and tests
        run: npm run check

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Package static frontend
        run: tar -czf frontendClase16Nov.tar.gz index.html script.js style.css

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontendClase16Nov-static-site
          path: frontendClase16Nov.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir site
          cp index.html script.js style.css site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
